server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SSE 事件流（任务状态/流式拆镜实时推送）：必须禁缓冲 + HTTP/1.1（chunked）+ 长读超时；
    # 后端也带 X-Accel-Buffering: no，宿主机外层 nginx 会照此禁缓冲，无需改宿主配置
    location ~ ^/api/projects/[0-9]+/events$ {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 代理后端 API（Docker Compose 网络中使用服务名 backend，端口 8765）
    # 长读超时：同步接口里有真等 LLM 的（如 POST /chapters/{id}/write 整章写作，
    # 6-10 分钟成片量级的正文远超一分钟）。此处此前没配 proxy_read_timeout，吃 nginx
    # 默认的 60s，线上实测必 504——而后端其实还在跑，只是响应回不来（2026-07-28）。
    # 宿主机那层 nginx 早已是 24h，瓶颈一直在这个容器内的 conf。
    location /api/ {
        proxy_pass http://backend:8765;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
